<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자유질문 상담 · 이직·실업급여</title>
  <link rel="icon" href="./assets/brand-mark.svg">
  <link rel="stylesheet" href="./consult.css">
  <script type="module" src="./consult.js"></script>
</head>
<body>
  <main>
    <nav><a href="./">← 이직·실업급여 온톨로지</a></nav>
    <h1>실업급여 상담</h1>
    <form id="consult">
      <label for="question">무엇이 궁금하세요?</label>
      <textarea id="question" name="question" rows="4" maxlength="4000" required></textarea>
      <details>
        <summary>과거 상담일로 조회</summary>
        <label for="as-of">상담 기준일</label>
        <input id="as-of" name="asOf" type="date" aria-describedby="date-help">
        <small id="date-help">비워 두면 오늘 기준으로 답합니다. 퇴사일은 질문에 적어 주세요.</small>
      </details>
      <div class="actions"><button type="submit">질문하기</button></div>
    </form>
    <p id="status" role="status"></p>
    <section id="result" hidden aria-label="상담 답변">
      <h2>상담 답변</h2>
      <div id="answer"></div>
      <ul id="questions"></ul>
      <details id="sources"><summary>답변 근거</summary><ul></ul></details>
      <small id="metadata"></small>
    </section>
  </main>
</body>
</html>
